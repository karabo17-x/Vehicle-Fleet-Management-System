# Main CI/CD pipeline: backend (FastAPI) and frontend (Vite) testing
# and builds, an end-to-end integration smoke test across all three
# services, and Docker image publishing on merges to main.
#
# The auth/ service has its own focused workflow (auth.yml) so Go
# tooling only runs when auth/ actually changes; this workflow still
# builds and starts the auth service as part of the integration job,
# since the backend cannot be meaningfully tested end-to-end without it.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------
  # Backend: install deps, run the pytest suite against an isolated
  # in-memory SQLite database (same override used for local testing --
  # see backend/README.md).
  # ---------------------------------------------------------------
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite://"
        run: pytest -q

  # ---------------------------------------------------------------
  # Frontend: install deps and run a production build. `vite build`
  # is the cheapest reliable way to catch a broken import or syntax
  # error across every module before it reaches a PR review.
  # ---------------------------------------------------------------
  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # Integration smoke test: build the real auth binary and start it
  # alongside the backend (pointed at the auth service's freshly
  # generated key), then confirm both services actually come up and
  # respond on their /health endpoints together -- i.e. the backend
  # can find and load the auth service's public key correctly at
  # startup. This does NOT exercise the login -> JWT -> authorized
  # request flow; that would need to be checked separately (locally,
  # or by re-adding a login-verification step here) if deeper
  # end-to-end coverage is wanted later.
  # ---------------------------------------------------------------
  integration-smoke-test:
    name: Integration smoke test (auth + backend)
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: auth/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build auth service
        working-directory: auth
        run: go build -o /tmp/auth-bin ./cmd

      - name: Start auth service
        working-directory: auth
        run: |
          AUTH_PORT=8081 nohup /tmp/auth-bin > /tmp/auth.log 2>&1 < /dev/null &
          for _ in $(seq 1 10); do
            curl -sf localhost:8081/health && break
            sleep 1
          done
          curl -sf localhost:8081/health || (cat /tmp/auth.log && exit 1)

      - name: Start backend service
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:////tmp/ci_smoke.db"
          AUTH_PUBLIC_KEY_PATH: "../auth/keys/public.pem"
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 < /dev/null &
          for _ in $(seq 1 15); do
            curl -sf localhost:8000/health && break
            sleep 1
          done
          curl -sf localhost:8000/health || (cat /tmp/backend.log && exit 1)

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- auth.log ---"; cat /tmp/auth.log || true
          echo "--- backend.log ---"; cat /tmp/backend.log || true

  # ---------------------------------------------------------------
  # CD: build and publish Docker images to GitHub Container Registry.
  # Only runs on a successful push to main -- not on develop, not on
  # pull requests -- so an image is only published once work has
  # actually been merged.
  #
  # Note: the frontend is deployed separately via Vercel's native
  # GitHub integration, which auto-builds and deploys on push once the
  # repo is connected in the Vercel dashboard. No step is needed here
  # for that -- adding one would just duplicate what Vercel already
  # does.
  # ---------------------------------------------------------------
  publish-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, integration-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [auth, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
