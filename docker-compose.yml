version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: vfms_user
      POSTGRES_PASSWORD: vfms_pass
      POSTGRES_DB: vfms
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"

  auth:
    build: ./auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - auth
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://vfms_user:vfms_pass@db:5432/vfms"
      AUTH_PUBLIC_KEY_URL: "http://auth:8081/.well-known/public-key.pem"
      JWT_ISSUER: "auth"
    volumes:
      - ./backend:/app:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - auth
    ports:
      - "5173:5173"
    environment:
      - VITE_DEV_SERVER=true

volumes:
  db-data:
    name: vfms_db_data
