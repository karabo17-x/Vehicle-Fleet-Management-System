<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFMS — Drivers</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand-mark">VFMS<span>.</span></div>
        <nav>
          <a href="/dashboard.html">Dashboard</a>
          <a href="/vehicles.html">Vehicles</a>
          <a class="active" href="/drivers.html">Drivers</a>
          <a href="#">Assignments</a>
          <a href="/maintenance.html">Maintenance</a>
          <a href="#">Reports</a>
        </nav>
        <button id="logout-btn" type="button">Sign out</button>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>Drivers</h1>
          <button class="btn btn-primary" id="add-btn">Add driver</button>
        </div>
        <p id="notice" class="notice" role="status" hidden></p>

        <div class="filter-bar">
          <input id="search" type="search" placeholder="Search by name…" />
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th id="licence-col">Licence number</th>
              <th>Licence expiry</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr class="loading-row"><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </main>
    </div>

    <dialog class="form-dialog" id="driver-dialog">
      <form class="dialog-inner" id="driver-form" method="dialog">
        <h2 id="dialog-title">Add driver</h2>
        <input type="hidden" id="d-id" />
        <div class="field">
          <label for="d-first">First name *</label>
          <input id="d-first" required />
        </div>
        <div class="field">
          <label for="d-last">Last name *</label>
          <input id="d-last" required />
        </div>
        <div class="field" id="licence-field">
          <label for="d-licence">Licence number *</label>
          <input id="d-licence" required />
        </div>
        <div class="field">
          <label for="d-expiry">Licence expiry *</label>
          <input id="d-expiry" type="date" required />
        </div>
        <div class="field">
          <label for="d-status">Status *</label>
          <select id="d-status" required>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/pages/drivers.page.js"></script>
  </body>
</html>
