<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFMS — Maintenance</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand-mark">VFMS<span>.</span></div>
        <nav>
          <a href="/dashboard.html">Dashboard</a>
          <a href="/vehicles.html">Vehicles</a>
          <a href="/drivers.html">Drivers</a>
          <a href="#">Assignments</a>
          <a class="active" href="/maintenance.html">Maintenance</a>
          <a href="#">Reports</a>
        </nav>
        <button id="logout-btn" type="button">Sign out</button>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>Maintenance</h1>
          <button class="btn btn-primary" id="add-btn">Log maintenance</button>
        </div>
        <p id="notice" class="notice" role="status" hidden></p>

        <div class="filter-bar">
          <select id="vehicle-filter">
            <option value="">All vehicles</option>
          </select>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Date</th>
              <th>Description</th>
              <th>Cost</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr class="loading-row"><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </main>
    </div>

    <dialog class="form-dialog" id="maint-dialog">
      <form class="dialog-inner" id="maint-form" method="dialog">
        <h2 id="dialog-title">Log maintenance</h2>
        <input type="hidden" id="m-id" />
        <div class="field">
          <label for="m-vehicle">Vehicle *</label>
          <select id="m-vehicle" required></select>
        </div>
        <div class="field">
          <label for="m-date">Service date *</label>
          <input id="m-date" type="date" required />
        </div>
        <div class="field">
          <label for="m-description">Description *</label>
          <input id="m-description" required />
        </div>
        <div class="field">
          <label for="m-cost">Cost (R) *</label>
          <input id="m-cost" type="number" min="0" step="0.01" required />
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/pages/maintenance.page.js"></script>
  </body>
</html>
